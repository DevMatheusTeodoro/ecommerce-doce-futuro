<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso | Doce Futuro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-5">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">🧁 Doce Futuro</a>
        <a href="/" class="btn btn-outline-light btn-sm">Voltar à Vitrine</a>
      </div>
    </nav>

    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <div class="row g-4 justify-content-center">
        <!-- Card de Login -->
        <div class="col-md-5">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body p-4">
              <h4 class="fw-bold mb-3">Já sou cliente</h4>
              <form action="/login" method="POST">
                <div class="mb-3">
                  <label class="form-label">E-mail</label>
                  <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Senha</label>
                  <input
                    type="password"
                    name="senha"
                    class="form-control"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-dark w-100">Entrar</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Card de Cadastro -->
        <div class="col-md-5">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body p-4">
              <h4 class="fw-bold mb-3">Criar nova conta</h4>
              <form action="/cadastro" method="POST">
                <div class="mb-3">
                  <label class="form-label">Nome completo</label>
                  <input
                    type="text"
                    name="nome"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">E-mail</label>
                  <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Telefone / WhatsApp</label>
                  <input
                    type="text"
                    name="telefone"
                    class="form-control"
                    placeholder="(11) 99999-9999"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Senha</label>
                  <input
                    type="password"
                    name="senha"
                    class="form-control"
                    minlength="4"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-warning fw-bold w-100">
                  Cadastrar e Continuar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
